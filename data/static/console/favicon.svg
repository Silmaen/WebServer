<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- Network nodes and links -->
  <!-- Center node -->
  <circle cx="32" cy="32" r="6" fill="#fff"/>
  <!-- Top node -->
  <circle cx="32" cy="12" r="4.5" fill="#fff" opacity="0.9"/>
  <line x1="32" y1="18" x2="32" y2="26" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Bottom-left node -->
  <circle cx="14" cy="48" r="4.5" fill="#fff" opacity="0.9"/>
  <line x1="18" y1="45" x2="27" y2="36" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Bottom-right node -->
  <circle cx="50" cy="48" r="4.5" fill="#fff" opacity="0.9"/>
  <line x1="46" y1="45" x2="37" y2="36" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Top-left node -->
  <circle cx="12" cy="22" r="3.5" fill="#fff" opacity="0.7"/>
  <line x1="15" y1="24" x2="27" y2="29" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <!-- Top-right node -->
  <circle cx="52" cy="22" r="3.5" fill="#fff" opacity="0.7"/>
  <line x1="49" y1="24" x2="37" y2="29" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <!-- Pulse ring on center -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
</svg>
