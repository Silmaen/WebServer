{% extends "base.html" %}
{% load static %}

{% block title %}Administration - Network Monitor{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-gear me-2"></i>Administration</h1>
    <a href="/admin/" class="btn btn-outline-secondary" target="_blank">
        <i class="bi bi-box-arrow-up-right me-1"></i> Django Admin
    </a>
</div>

<ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overview" type="button" role="tab">
            <i class="bi bi-speedometer2 me-1"></i> Vue d'ensemble
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="tasks-tab" data-bs-toggle="tab" data-bs-target="#tasks" type="button" role="tab">
            <i class="bi bi-list-check me-1"></i> T&acirc;ches
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="credentials-tab" data-bs-toggle="tab" data-bs-target="#credentials" type="button" role="tab">
            <i class="bi bi-key me-1"></i> Credentials Gateway
        </button>
    </li>
</ul>

<div class="tab-content">
    <!-- Overview tab -->
    <div class="tab-pane fade show active" id="overview" role="tabpanel">
        {% include "core/_admin_overview.html" %}
    </div>

    <!-- Tasks tab -->
    <div class="tab-pane fade" id="tasks" role="tabpanel"
         hx-get="{% url 'core:admin-tasks-partial' %}"
         hx-trigger="shown.bs.tab from:#tasks-tab once"
         hx-swap="innerHTML">
        <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Chargement...</div>
    </div>

    <!-- Credentials tab -->
    <div class="tab-pane fade" id="credentials" role="tabpanel"
         hx-get="{% url 'core:admin-credentials-partial' %}"
         hx-trigger="shown.bs.tab from:#credentials-tab once"
         hx-swap="innerHTML">
        <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Chargement...</div>
    </div>
</div>
{% endblock %}
