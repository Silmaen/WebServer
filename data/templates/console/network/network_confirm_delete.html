{% extends "base.html" %}

{% block console_content %}
<div class="row">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body">
                <h5 class="card-title text-danger">
                    <i class="mdi mdi-alert me-1"></i> Confirmation
                </h5>
                <p class="card-text">
                    Êtes-vous sûr de vouloir supprimer le réseau
                    <strong>{{ network.name }}</strong> ({{ network.cidr }}) ?
                </p>
                <p class="card-text text-muted small">Cette action est irréversible.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="mdi mdi-delete me-1"></i> Supprimer
                        </button>
                        <a href="{% url 'network:list' %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
