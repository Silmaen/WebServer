---
services:
  # data base
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argawaen}
      POSTGRES_USER: ${POSTGRES_USER:-argawaen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argawaen}
    # Left to itself, wud picks the "greatest" tag of the repository and announced a
    # major update towards `19beta2-trixie` -- a beta, on Debian, not even the alpine
    # variant. The constraint keeps it on the current major, so the fleet page reports
    # a real lag or nothing. Bumping the image means bumping this regex on the same
    # line of thought, which is exactly when the question deserves to be asked.
    # watch.digest, because with the tag pinned to one major there is no greater tag to
    # find: the only remaining signal is the same tag being republished, which is where
    # the minor releases -- and their security fixes -- arrive. `deploy.sh` pulls them.
    labels:
      wud.tag.include: '^16-alpine$$'
      wud.watch.digest: 'true'
    volumes:
      - ${SERVER_PATH_PGDB:-./docker_data/db}:/var/lib/postgresql/data
    # On the loopback only, and only because celery_scanner runs with the host's
    # network namespace: from there the `db` service name resolves to nothing.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argawaen} -d ${POSTGRES_DB:-argawaen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # messaging
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Same reason as db: left unconstrained, wud offered `32bit-stretch` as an upgrade.
    labels:
      wud.tag.include: '^8-alpine$$'
      wud.watch.digest: 'true'
    # Same reason as db above: the scanner reaches it at 127.0.0.1.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # main webserver
  web:
    build: .
    restart: unless-stopped
    # Built here, so it exists in no registry: wud was looking up
    # `library/webserver-web:latest` on Docker Hub and reporting a 401 for it. Nothing
    # is lost by excluding it -- what this image tracks is the Dockerfile's base, and
    # `deploy.sh` pulls that at every deployment.
    labels:
      wud.watch: 'false'
    dns: ${SERVER_DNS:-8.8.8.8}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ${SERVER_PATH_MEDIA:-./docker_data/media}:/app/data/media
      # The lab's machine list, read-only, from the home-server-stacks checkout on the
      # same machine. apps.fleet mirrors it into Machine rows and never writes it back:
      # busybox awk on the router parses the same file, so it stays the source of
      # truth. Without it the fleet page can only show machines that reported -- and a
      # machine that never reported is the interesting case.
      - ${INVENTORY_FILE:-/srv/home-server-stacks/_common/inventory.conf}:/app/inventory.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # network discovery worker
  #
  # Separate from `web` on purpose, and the only service with privileges: scanning the
  # LAN needs the host's network namespace plus NET_ADMIN/NET_RAW, and none of that
  # belongs in the container that serves a publicly exposed site. It consumes only the
  # `network` queue -- apps.network.* and apps.devices.tasks.* are routed there by
  # CELERY_TASK_ROUTES.
  #
  # network_mode: host is why db and redis publish on 127.0.0.1 above: inside the
  # host's namespace the compose service names do not resolve.
  celery_scanner:
    build: .
    restart: unless-stopped
    # Same image as web, same absence from any registry.
    labels:
      wud.watch: 'false'
    entrypoint: [""]
    command: celery -A multisite worker -Q network -n scanner@%h --concurrency 4 --loglevel=info
    working_dir: /app/multisite
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=${POSTGRES_PORT:-5432}
      - CELERY_BROKER_URL=redis://127.0.0.1:${REDIS_PORT:-6379}/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
